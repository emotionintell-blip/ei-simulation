<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Симуляция эмоционального интеллекта</title>
  <style>
    :root {
      --bg: #f6f0e6;
      --paper: #fffaf0;
      --paper-2: #fbf3e5;
      --text: #23201d;
      --muted: #6e665d;
      --line: #ded2c0;
      --accent: #2f5bff;
      --accent-2: #ff6b35;
      --accent-3: #c8ff3d;
      --good: #2b7a57;
      --shadow: 0 18px 50px rgba(38, 32, 24, 0.10);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --max: 980px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        linear-gradient(120deg, rgba(47, 91, 255, 0.045), transparent 32%),
        radial-gradient(circle at top right, rgba(255, 107, 53, 0.09), transparent 28%),
        var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.33;
      background-image:
        linear-gradient(30deg, rgba(70, 60, 45, 0.12) 1px, transparent 1px),
        linear-gradient(150deg, rgba(70, 60, 45, 0.10) 1px, transparent 1px);
      background-size: 34px 58px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    button, input, textarea { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    .app-shell {
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: 18px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.01em;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border: 2px solid var(--text);
      border-radius: 50%;
      position: relative;
      background: var(--accent-3);
      box-shadow: 4px 4px 0 var(--text);
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      right: -5px;
      top: 5px;
      border-radius: 50%;
      background: var(--accent-2);
      border: 2px solid var(--text);
    }

    .progress-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.70);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .card {
      background: rgba(255, 250, 240, 0.88);
      border: 1px solid rgba(222, 210, 192, 0.92);
      box-shadow: var(--shadow);
      border-radius: var(--radius-xl);
      padding: clamp(22px, 4vw, 46px);
      backdrop-filter: blur(9px);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      right: 18px;
      top: 18px;
      width: 70px;
      height: 22px;
      border-radius: 999px;
      transform: rotate(4deg);
      background: rgba(47, 91, 255, 0.10);
      border: 1px solid rgba(47, 91, 255, 0.14);
    }

    .screen { animation: rise 260ms ease-out; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .kicker {
      color: var(--accent);
      font-weight: 760;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 12px;
      margin: 0 0 14px;
    }

    h1, h2, h3 {
      margin: 0;
      line-height: 1.04;
      letter-spacing: -0.045em;
    }

    h1 {
      font-size: clamp(42px, 12vw, 86px);
      max-width: 900px;
    }

    h2 { font-size: clamp(30px, 7vw, 58px); }
    h3 { font-size: clamp(22px, 4vw, 32px); }

    p {
      line-height: 1.62;
      font-size: 17px;
      margin: 14px 0 0;
    }

    .lead {
      font-size: clamp(18px, 3.5vw, 24px);
      max-width: 780px;
      color: #37322c;
    }

    .muted { color: var(--muted); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      min-height: 48px;
      border-radius: 999px;
      padding: 13px 20px;
      font-weight: 760;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(1px); }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 10px 24px rgba(47, 91, 255, 0.25);
    }

    .btn-secondary {
      background: rgba(255, 250, 240, 0.72);
      border: 1px solid var(--line);
      color: var(--text);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      padding-inline: 6px;
    }

    .notice {
      margin-top: 22px;
      padding: 16px 18px;
      border-radius: var(--radius-lg);
      background: rgba(255, 107, 53, 0.08);
      border: 1px solid rgba(255, 107, 53, 0.20);
    }

    .grid {
      display: grid;
      gap: 14px;
      margin-top: 24px;
    }

    .option {
      width: 100%;
      text-align: left;
      background: rgba(255, 250, 240, 0.96);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px;
      color: var(--text);
      min-height: 72px;
      box-shadow: 0 8px 22px rgba(38, 32, 24, 0.055);
      position: relative;
    }

    .option:hover, .option.selected {
      border-color: rgba(47, 91, 255, 0.65);
      box-shadow: 0 12px 28px rgba(47, 91, 255, 0.10);
      background: white;
    }

    .option .label {
      font-size: 16px;
      line-height: 1.45;
      display: block;
    }

    .option.selected::after {
      content: "выбрано";
      position: absolute;
      right: 14px;
      top: 12px;
      font-size: 11px;
      color: var(--accent);
      font-weight: 760;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .scene-box {
      margin-top: 24px;
      border-radius: var(--radius-xl);
      padding: clamp(20px, 4vw, 34px);
      background:
        linear-gradient(135deg, rgba(47, 91, 255, 0.10), transparent 48%),
        var(--paper);
      border: 1px solid var(--line);
    }

    .quote {
      margin: 18px 0 0;
      padding-left: 18px;
      border-left: 4px solid var(--accent-2);
      font-size: clamp(20px, 5vw, 34px);
      line-height: 1.16;
      letter-spacing: -0.02em;
      font-weight: 820;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(35, 32, 29, 0.06);
      border: 1px solid rgba(35, 32, 29, 0.09);
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 13px;
    }

    .load-dots {
      display: inline-flex;
      gap: 4px;
      margin-left: 2px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--line);
    }

    .dot.on { background: var(--accent-2); }

    .mini-note {
      margin-top: 18px;
      font-size: 14px;
      color: var(--muted);
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .mini-note span:first-child {
      color: var(--accent-2);
      font-weight: 900;
    }

    .feedback-card {
      margin-top: 22px;
      display: grid;
      gap: 14px;
    }

    .feedback-item {
      background: rgba(255, 255, 255, 0.52);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 16px;
    }

    .feedback-item strong {
      display: block;
      margin-bottom: 6px;
    }

    .result-layout {
      display: grid;
      gap: 16px;
      margin-top: 24px;
    }

    .result-block {
      background: rgba(255,255,255,0.54);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px;
    }

    .result-block h3 {
      font-size: 20px;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .result-block ul {
      margin: 10px 0 0;
      padding-left: 20px;
      line-height: 1.6;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 24px 0;
    }

    .theory-panel {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }

    .theory-item {
      padding: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.44);
      border-radius: var(--radius-lg);
    }

    .theory-item strong { color: var(--accent); }

    .footer-note {
      margin: 18px auto 0;
      max-width: var(--max);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
    }

    .hidden { display: none !important; }

    @media (min-width: 760px) {
      .app-shell { padding: 28px; }
      .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .result-layout { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .result-block.wide { grid-column: 1 / -1; }
    }

    @media print {
      body { background: white; }
      body::before, .topbar, .actions, .no-print, .footer-note { display: none !important; }
      .app-shell { width: 100%; max-width: none; padding: 0; }
      .card {
        box-shadow: none;
        border: 0;
        border-radius: 0;
        padding: 0;
        background: white;
      }
      .card::before { display: none; }
      .result-layout { display: block; }
      .result-block { page-break-inside: avoid; margin-bottom: 12px; }
      h1 { font-size: 34px; }
      h2 { font-size: 28px; }
      p, li { font-size: 12pt; }
    }


    .tag.load-tag {
      background: rgba(200, 255, 61, 0.44);
      border-color: rgba(35, 32, 29, 0.18);
      color: var(--text);
      font-weight: 760;
    }

    .load-dots .dot.on { background: var(--accent-2); box-shadow: 0 0 0 2px rgba(255, 107, 53, 0.16); }

    @media (min-width: 760px) {
      .theory-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

  </style>
</head>

        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

      if (!state.actionOrders[scene.id]) {
        state.actionOrders[scene.id] = shuffle(scene.options).map(option => option.id);

      return state.actionOrders[scene.id].map(id => scene.options.find(option => option.id === id)).filter(Boolean);
    }

    function getAnswer(sceneId) { return state.answers[sceneId] || {}; }

        branch: "Здесь работает использование эмоций как информации. Раздражение показывает место, где процесс требует ясности: не просто «мне неприятно», а «нужно зафиксировать правила»."
      },
      "scene-5": {
        intro: "Здесь неудобство сидит в тишине. Все будто понимают, что слабое место есть, но трогать его страшно: можно разрушить хрупкое согласие и снова открыть спор.",
        byReaction: {
          withdraw: "Ты скорее не поднимаешь вопрос вслух, чтобы не ломать встречу. Так сохраняется видимое спокойствие, но риск остаётся жить под ковром.",
          defend: "Ты говоришь, что замалчивать проблему опаснее, чем спокойно её уточнить. Это защита качества решения, а не просто спор ради спора.",
          explain: "Ты пытаешься показать, почему без уточнения решение может развалиться позже. Это способ сделать риск видимым, не превращая разговор в атаку.",
          negotiate: "Ты предлагаешь коротко зафиксировать риск и договориться, что проверяем после встречи. Так неудобный вопрос получает рабочую форму."
        },
        strength: {
          withdraw: "Ты чувствуешь хрупкость момента и не хочешь добавлять давления туда, где люди уже на пределе.",
          defend: "Ты защищаешь профессиональную границу подхода к своей работе, которую не готов(а) перешагнуть: не всё, что ускоряет встречу, помогает делу.",
          explain: "Ты умеешь объяснить риск через последствия, а не через претензию к людям.",
          negotiate: "Ты превращаешь неудобную тишину в минимальный следующий шаг, который не разрушает разговор."
        },
        cost: {
          withdraw: "проблема может остаться без имени, а значит, вернуться позже уже в более дорогой форме",
          defend: "сильная защита качества может прозвучать как давление, если не показать заботу о результате",
          explain: "можно перегрузить встречу аргументами и всё равно не получить решения, если не сформулировать следующий шаг",
          negotiate: "слишком аккуратная договорённость может смягчить конфликт, но не дать вопросу нужной силы"
        },
        branch: "Здесь важна управляемая смелость: заметить эмоцию, понять, что она защищает качество результата, и выбрать форму, которая открывает факты, а не закрывает разговор."
      },
      "scene-6": {
        intro: "На этом уровне напряжение уже личное: обвинение звучит резко, при людях и с большим обобщением. Эмоция может включиться как сигнал угрозы достоинству и справедливости.",
        byReaction: {
          withdraw: "Ты скорее замолкаешь, чтобы не сорваться. Это может удержать форму, но внутри остаётся сильное напряжение и невысказанная позиция.",
          defend: "Ты быстро останавливаешь обвинение и просишь говорить фактами. Это защита границы там, где фраза уже перешла в личную оценку.",
          explain: "Ты подробно объясняешь, что было не в твоей зоне ответственности. Это попытка вернуть справедливость и не дать обвинению стать итогом встречи.",
          negotiate: "Ты предлагаешь разложить ситуацию по фактам: что произошло, где был сбой и что делаем дальше. Это перевод обвинения в рабочий разбор."
        },
        strength: {
          withdraw: "Ты можешь удержать себя от резкого ответа, когда эмоция уже очень сильная.",
          defend: "Ты показываешь, что личные обвинения не являются нормальной формой рабочего разговора.",
          explain: "Ты возвращаешь разговор к зонам ответственности и не позволяешь одной фразе заменить разбор ситуации.",
          negotiate: "Ты помогаешь группе выйти из обвинения к фактам, решениям и следующему шагу."
        },
        cost: {
          withdraw: "твоя версия может не прозвучать, а напряжение останется внутри и начнёт работать фоном уже после встречи",
          defend: "сила защиты может закрыть разговор, если форма прозвучит как встречная атака",
          explain: "можно попасть в длинное оправдание, где ты всё больше доказываешь право не быть виноватым(ой)",
          negotiate: "можно слишком быстро рационализировать ситуацию и не дать себе признать, что обвинение было действительно болезненным"
        },
        branch: "Здесь включается управление эмоцией: не подавить злость, а дать ей цивилизованный выход. Это четвёртая ветвь ЭИ — регулировать свой способ действовать."
      }
    };

    const repeatInsightByReaction = {
      withdraw: {
        second: "Похоже, пауза или уход в тишину уже появлялись раньше. Ситуации разные, но организм снова выбирает снизить шум и не выводить напряжение наружу. В ЭИ это важная подсказка: сначала стоит учиться распознавать момент, когда пауза помогает, а когда уже прячет твою позицию.",
        third: "Эта тактика начинает выглядеть как паттерн: при давлении ты можешь сохранять внешнее спокойствие, но цена часто уходит внутрь. Возможный триггер — риск конфликта, публичности или чужой оценки.",
        later: "Пауза снова выходит первой. Это уже не случайность, а ведущий маршрут самозащиты. Следующий шаг — тренировать короткое возвращение в контакт: не говорить много, но всё-таки обозначать, что для тебя важно."
      },
      defend: {
        second: "Похоже, быстрая защита границы уже появлялась раньше. Это может означать, что ты хорошо слышишь давление, но дальше важно смотреть на форму: она открывает разговор или сразу ставит баррикаду?",
        third: "Защита границы становится заметным маршрутом. Возможный триггер — тон, несправедливость или попытка переложить ответственность. В ЭИ здесь начинается тренировка управления эмоциями: оставить силу, но выбрать форму точнее.",
        later: "Граница снова выходит первой. Значит, система защиты работает быстро и уверенно. Теперь задача развития не в том, чтобы стать мягче любой ценой, а в том, чтобы твёрдость не превращалась в лишнее давление на контакт."
      },
      explain: {
        second: "Похоже, объяснение уже появлялось раньше. Ситуации разные, а маршрут узнаваемый: сначала прояснить, доказать контекст, вернуть разговор в понятную рамку. Это может быть способом защититься от риска быть неправильно понятым(ой).",
        third: "Объяснение начинает становиться паттерном. Возможный триггер — неопределённость, обесценивание или ощущение, что без подробностей тебя оценят несправедливо. Здесь важно отличать полезное прояснение от оправдания.",
        later: "Ты снова идёшь через объяснение. Это сильный аналитический ресурс, но ему нужна граница: сколько фактов достаточно, чтобы прояснить ситуацию, и где начинается попытка заслужить право быть понятым(ой)?"
      },
      negotiate: {
        second: "Похоже, договорённость уже появлялась раньше. Ты снова пытаешься превратить напряжение в следующий шаг. Это сильный навык, но стоит проверять: не перепрыгиваешь ли ты через собственную эмоцию слишком быстро?",
        third: "Договорённость становится устойчивой линией поведения. Возможный триггер — хаос, неопределённость или риск потерять рабочий результат. В ЭИ здесь важно использовать эмоцию как информацию, а не сразу закрывать её планом действий.",
        later: "Ты снова собираешь договорённость. Это похоже на ведущую стратегию: быстро вернуть управляемость. Следующий уровень развития — перед решением на секунду спрашивать себя, что именно задело и какую потребность важно не потерять."
      }
    };

    function previousSameReactionCount(sceneId, reactionCode) {
      const currentIndex = scenes.findIndex(scene => scene.id === sceneId);
      return scenes.slice(0, currentIndex).filter(scene => getAnswer(scene.id).reactionCode === reactionCode).length;
    }

    function repeatInsight(sceneId, reactionCode) {
      const count = previousSameReactionCount(sceneId, reactionCode);
      const variants = repeatInsightByReaction[reactionCode] || repeatInsightByReaction.explain;
      if (count === 0) return "";
      if (count === 1) return variants.second;
      if (count === 2) return variants.third;
      return variants.later;
    }

    function getFeedbackCopy(scene, answer) {
      const sceneCopy = sceneReflectionCopy[scene.id] || sceneReflectionCopy["scene-1"];
      const reaction = answer.reactionCode || "explain";
      return {
        intro: sceneCopy.intro,
        reactionText: sceneCopy.byReaction[reaction] || sceneCopy.byReaction.explain,
        strength: sceneCopy.strength[reaction] || sceneCopy.strength.explain,
        cost: sceneCopy.cost[reaction] || sceneCopy.cost.explain,
        branch: sceneCopy.branch
      };
    }

    function renderFeedback() {
      const scene = getCurrentScene();
      const answer = getAnswer(scene.id);
      const copy = getFeedbackCopy(scene, answer);
      const need = needMeta[answer.needCode] || "понять, что здесь оказалось важным";
      const emotion = emotionMeta[answer.emotionCode] || "напряжение";
      const repeat = repeatInsight(scene.id, answer.reactionCode);
      return `
        <section class="screen">
          <p class="kicker">Минута самоанализа</p>
          <h2>На что важно обратить внимание</h2>
          <p class="lead">${escapeHtml(copy.intro)} ${escapeHtml(copy.reactionText)}</p>
          ${repeat ? `<p>${escapeHtml(repeat)}</p>` : ""}
          <div class="feedback-card">
            <div class="feedback-item"><strong>Что здесь придает тебя силу</strong><p>${escapeHtml(copy.strength)}</p></div>
            <div class="feedback-item"><strong>Где автопилот может взять на себя лишнее</strong><p>Иногда ты платишь тем, что ${escapeHtml(copy.cost)}.</p></div>
            <div class="feedback-item"><strong>Что для тебя здесь важно</strong><p>В выбранной причине звучит желание ${escapeHtml(need)}. А по состоянию ближе всего было: «${escapeHtml(emotion)}».</p></div>
            <div class="feedback-item"><strong>Вопрос на заметку</strong><p>${escapeHtml(scene.reflectionQuestion)}</p></div>
            <div class="feedback-item wide"><strong>Личная траектория</strong><p>${escapeHtml(copy.branch)}</p><p>${escapeHtml(scene.eiNote)}</p></div>
          </div>
          <div class="actions">
            <button class="btn btn-primary" onclick="nextAfterFeedback()">${[1,3,5].includes(state.sceneIndex) ? "К промежуточному итогу" : "Идем дальше"}</button>
          </div>
        </section>
      `;
    }

    function nextAfterFeedback() {
      const justFinished = getCurrentScene();
      const nextIndex = state.sceneIndex + 1;
      if (["scene-2", "scene-4", "scene-6"].includes(justFinished.id)) setState({ screen: "level", level: justFinished.level });
      else setState({ screen: "scene", sceneIndex: nextIndex, questionStep: "action" });
    }

    function renderLevel() {
      const level = state.level || getCurrentScene()?.level || 1;
      const note = levelNotes[level];
      const isLast = level === 3;
      return `
        <section class="screen">
          <p class="kicker">Промежуточный итог</p>
          <h2>${escapeHtml(note.title)}</h2>
          <div class="scene-box">
            <p class="lead">${escapeHtml(note.text)}</p>
            <p>${escapeHtml(note.prompt)}</p>
          </div>
          <div class="actions">
            <button class="btn btn-primary" onclick="continueAfterLevel(${level})">${isLast ? "Собрать карту" : "Идем дальше"}</button>
          </div>
        </section>
      `;
    }

    function continueAfterLevel(level) {
      if (level === 1) setState({ screen: "scene", sceneIndex: 2, questionStep: "action" });
      else if (level === 2) setState({ screen: "scene", sceneIndex: 4, questionStep: "action" });
      else setState({ screen: "final" });
    }

    function countBy(items, key) {
      return items.reduce((acc, item) => {
        const value = item[key];
        if (value) acc[value] = (acc[value] || 0) + 1;
        return acc;
      }, {});
    }

    function topEntries(counts) {
      const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      if (!entries.length) return [];
      const max = entries[0][1];
      return entries.filter(entry => entry[1] === max);
    }

    function allCompletedAnswers() {
      return scenes.map(scene => ({ scene, ...getAnswer(scene.id) })).filter(answer => answer.actionId && answer.reasonId && answer.stateId);
    }

    function buildResult() {
      const answers = allCompletedAnswers();
      const reactionCounts = countBy(answers, "reactionCode");
      const needCounts = countBy(answers, "needCode");
      const emotionCounts = countBy(answers, "emotionCode");
      const topReactions = topEntries(reactionCounts).map(([code, count]) => ({ code, count, ...reactionMeta[code] }));
      const topNeeds = topEntries(needCounts).map(([code, count]) => ({ code, count, label: needMeta[code] }));
      const topEmotions = topEntries(emotionCounts).map(([code, count]) => ({ code, count, label: emotionMeta[code] }));
      const highLoad = answers.filter(item => item.scene.level === 3);
      const highReaction = topEntries(countBy(highLoad, "reactionCode")).map(([code]) => reactionMeta[code]?.short).filter(Boolean).join(" и ");
      const topBranch = topReactions[0]?.branch || "управления эмоциями";
      return { answers, topReactions, topNeeds, topEmotions, highReaction, reactionCounts, topBranch };
    }

    function renderFinal() {
      const result = buildResult();
      const top = result.topReactions[0] || reactionMeta.explain;
      const topList = result.topReactions.map(item => item.resultPhrase).join("; ") || top.resultPhrase;
      const needs = result.topNeeds.map(item => item.label).join("; ") || "понять, что в ситуации оказалось важным";
      const emotions = result.topEmotions.map(item => `«${item.label}»`).join("; ") || "напряжение";
      const practices = Array.from(new Set(result.topReactions.map(item => item.practice).concat([
        "Проверка интерпретации. Раз: отдели факт от догадки. Два: проверь вопросом — «Я правильно понимаю, что главный вопрос сейчас в следующем шаге, а не в оценке меня целиком?» Три: только потом отвечай.",
        "Называние состояния. Скажи себе коротко: «Я сейчас напрягся(лась), поэтому хочу уточнить факты, прежде чем отвечать». Это не слабость, а способ вернуть себе выбор."
      ]))).slice(0, 4);

      return `
        <section class="screen" id="printableReport">
          <p class="kicker">Карта самонаблюдения</p>
          <h1>Твой результат</h1>
          <p class="lead">Это не оценка личности, а черновик твоих реакций в шести ситуациях, в котором зафиксировано: где эмоция подала сигнал, какая траектория поведения включилась автоматически и с какой ветви эмоционального интеллекта лучше начать развитие.</p>

          <div class="result-layout">
            <div class="result-block wide">
              <h3>Самые частые реакции</h3>
              <p>В этот раз ты чаще пробовал(а) ${escapeHtml(topList)}.</p>
            </div>
            <div class="result-block">
              <h3>Что здесь придает тебя силу</h3>
              <p>Такая реакция поможет ${escapeHtml(top.value)}.</p>
            </div>
            <div class="result-block">
              <h3>Где автопилот может взять на себя лишнее</h3>
              <p>Иногда ты платишь тем, что ${escapeHtml(top.cost)}.</p>
            </div>
            <div class="result-block">
              <h3>Что для тебя здесь важно</h3>
              <p>В причинах чаще звучало желание ${escapeHtml(needs)}.</p>
            </div>
            <div class="result-block">
              <h3>Какие состояния повторялись</h3>
              <p>Чаще всего были ближе состояния: ${escapeHtml(emotions)}.</p>
            </div>
            <div class="result-block wide">
              <h3>Что происходило под нагрузкой</h3>
              <p>${result.highReaction ? `На третьем уровне чаще проявлялась реакция: <strong>${escapeHtml(result.highReaction)}</strong>. Под давлением выбор иногда сужается до самого привычного способа защиты. И это не ошибка, а точка входа в тренировку.` : "На третьем уровне данных недостаточно для наблюдения."}</p>
            </div>
            <div class="result-block wide">
              <h3>Личная траектория развития</h3>
              <p>По результатам прохождения симуляции первым фокусом вашего внимания к способностям эмоционального интеллекта может стать ${escapeHtml(result.topBranch)}. В модели эмоционального интеллекта это не абстрактная теория, а практический уровень: заметить эмоцию на более ресурсную, понять причину её возникновения, использовать сигналы тела и выбрать наиболее подходящее для конкретной ситуации действие.</p>
            </div>
            <div class="result-block">
              <h3>Сильные стороны</h3>
              <ul>
                ${result.topReactions.map(item => `<li>${escapeHtml(item.strength)}.</li>`).join("")}
                <li>Готовность смотреть на свои реакции без превращения этого в экзамен.</li>
              </ul>
            </div>
            <div class="result-block">
              <h3>Микро-практики</h3>
              <ul>${practices.map(text => `<li>${escapeHtml(text)}</li>`).join("")}</ul>
            </div>
            <div class="result-block wide">
              <h3>Дисклеймер</h3>
              <p>Этот отчёт не является диагнозом, психометрической оценкой или определением типа личности. Он отражает выбранные реакции в рамках симуляции и может использоваться как материал для самонаблюдения и развития эмоционального интеллекта.</p>
            </div>
          </div>
          <div class="actions no-print">
            <button class="btn btn-primary" onclick="savePdf()">Сохранить карту в PDF</button>
            <button class="btn btn-secondary" onclick="clearProgress()">Пройти ещё раз</button>
          </div>
        </section>
      `;
    }

    function savePdf() {
      const oldTitle = document.title;
      document.title = "Карта самонаблюдения — симуляция ЭИ";
      window.print();
      setTimeout(() => { document.title = oldTitle; }, 500);
    }

    function render() {
      const top = document.getElementById("topProgress");
      const progress = topProgressHtml();
      top.innerHTML = progress;
      top.classList.toggle("hidden", !progress);

      const app = document.getElementById("app");
      if (state.screen === "start") app.innerHTML = renderStart();
      if (state.screen === "consent") app.innerHTML = renderConsent();
      if (state.screen === "theory") app.innerHTML = renderTheory();
      if (state.screen === "instruction") app.innerHTML = renderInstruction();
      if (state.screen === "scene") app.innerHTML = renderSceneIntro();
      if (state.screen === "question") app.innerHTML = renderQuestion();
      if (state.screen === "feedback") app.innerHTML = renderFeedback();
      if (state.screen === "level") app.innerHTML = renderLevel();
      if (state.screen === "final") app.innerHTML = renderFinal();
    }

    window.setState = setState;
    window.startSimulation = startSimulation;
    window.continueProgress = continueProgress;
    window.clearProgress = clearProgress;
    window.selectAction = selectAction;
    window.selectReason = selectReason;
    window.selectFeeling = selectFeeling;
    window.completeScene = completeScene;
    window.nextAfterFeedback = nextAfterFeedback;
    window.continueAfterLevel = continueAfterLevel;
    window.goBackFromSceneIntro = goBackFromSceneIntro;
    window.savePdf = savePdf;

    render();
  </script>
</body>
</html>
